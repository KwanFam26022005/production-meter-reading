<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Khung cảnh tác nghiệp Cảng Tân Thuận - Cảng Sài Gòn">
  <defs>
    <!-- Sky & River Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBE3F0" />
      <stop offset="45%" stop-color="#E2F0F7" />
      <stop offset="85%" stop-color="#F2F7FA" />
      <stop offset="100%" stop-color="#E5EFF5" />
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A6D8C" />
      <stop offset="40%" stop-color="#245270" />
      <stop offset="100%" stop-color="#123B54" />
    </linearGradient>
    <linearGradient id="quayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B606D" />
      <stop offset="100%" stop-color="#2C3D47" />
    </linearGradient>
    <linearGradient id="shipHull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D2E38" />
      <stop offset="50%" stop-color="#2C4352" />
      <stop offset="100%" stop-color="#182730" />
    </linearGradient>
    <linearGradient id="craneSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5E8A" />
      <stop offset="100%" stop-color="#0F3D5C" />
    </linearGradient>
    <linearGradient id="sunAtmosphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#E8F2F8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="340" fill="url(#skyGrad)" />
  
  <!-- Subtle Sunlight Glow -->
  <circle cx="680" cy="90" r="140" fill="url(#sunAtmosphere)" />

  <!-- Distant Riverbank Silhouette (Thu Duc / District 7 across river) -->
  <path d="M0,230 Q180,222 360,226 T800,220 L800,245 L0,245 Z" fill="#9FB5C4" opacity="0.6" />
  <path d="M40,225 L65,215 L90,225 Z M180,228 L200,218 L220,228 Z M520,224 L550,212 L580,224 Z" fill="#88A2B3" opacity="0.7" />

  <!-- Saigon River Waterway -->
  <rect y="240" width="800" height="110" fill="url(#riverGrad)" />
  
  <!-- Water Waves / Reflections -->
  <path d="M0,250 C120,248 240,254 360,250 C480,246 600,252 800,249" stroke="#6AA3C4" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M0,268 C150,265 300,272 450,267 C600,263 720,270 800,267" stroke="#528AA8" stroke-width="2.5" fill="none" opacity="0.35" />
  <path d="M0,290 C180,287 350,294 530,289 C680,285 750,291 800,289" stroke="#3A6F8C" stroke-width="3" fill="none" opacity="0.3" />
  <path d="M0,318 C200,314 400,322 600,316 C700,313 760,319 800,317" stroke="#2D5A73" stroke-width="3" fill="none" opacity="0.3" />

  <!-- Cargo Vessel (Moored at Quayside) -->
  <g transform="translate(180, 160)">
    <!-- Vessel Hull -->
    <path d="M-80,95 L340,95 L320,135 L-40,135 Z" fill="url(#shipHull)" />
    <!-- Hull Red Stripe (Maritime Boot-topping) -->
    <path d="M-40,135 L320,135 L310,145 L-25,145 Z" fill="#B43A3A" />
    <!-- Superstructure / Bridge -->
    <rect x="230" y="30" width="70" height="65" rx="3" fill="#EAF1F5" stroke="#CBDCE6" stroke-width="1.5" />
    <rect x="240" y="42" width="50" height="12" rx="2" fill="#1B364A" />
    <rect x="255" y="15" width="20" height="15" fill="#CBDCE6" />
    <!-- Radar Mast -->
    <line x1="265" y1="15" x2="265" y2="-5" stroke="#476274" stroke-width="2" />
    <line x1="255" y1="2" x2="275" y2="2" stroke="#476274" stroke-width="1.5" />
    
    <!-- On-deck Containers -->
    <!-- Layer 1 -->
    <rect x="-20" y="65" width="55" height="30" rx="2" fill="#1B6088" />
    <rect x="40" y="65" width="55" height="30" rx="2" fill="#8C3535" />
    <rect x="100" y="65" width="55" height="30" rx="2" fill="#2D7A5E" />
    <rect x="160" y="65" width="55" height="30" rx="2" fill="#B87B28" />
    <!-- Layer 2 -->
    <rect x="-15" y="38" width="55" height="27" rx="2" fill="#2E4C60" />
    <rect x="45" y="38" width="55" height="27" rx="2" fill="#1B6088" />
    <rect x="105" y="38" width="55" height="27" rx="2" fill="#8C3535" />
  </g>

  <!-- Quay Cranes (STS / Gantry Cranes at Tan Thuan Terminal) -->
  <!-- Crane 1 (Left background crane) -->
  <g transform="translate(60, 45)">
    <!-- Tower Legs -->
    <line x1="60" y1="240" x2="85" y2="70" stroke="url(#craneSteel)" stroke-width="6" stroke-linecap="round" />
    <line x1="120" y1="240" x2="95" y2="70" stroke="url(#craneSteel)" stroke-width="6" stroke-linecap="round" />
    <!-- Cross Bracing -->
    <line x1="68" y1="190" x2="112" y2="130" stroke="#1A5E8A" stroke-width="3" />
    <line x1="112" y1="190" x2="68" y2="130" stroke="#1A5E8A" stroke-width="3" />
    <!-- Machine House / Top Beam -->
    <polygon points="75,70 105,70 120,20 60,20" fill="#0E3C5B" />
    <!-- Boom / Jib extending over river -->
    <line x1="20" y1="38" x2="220" y2="38" stroke="#12658F" stroke-width="7" stroke-linecap="round" />
    <line x1="60" y1="20" x2="190" y2="38" stroke="#0B4F75" stroke-width="3" />
    <!-- Hoist Cable & Spreader -->
    <line x1="150" y1="38" x2="150" y2="120" stroke="#4A6577" stroke-width="2" stroke-dasharray="4,2" />
    <rect x="135" y="120" width="30" height="8" rx="1" fill="#D9822B" />
  </g>

  <!-- Crane 2 (Prominent Right Quay Crane) -->
  <g transform="translate(480, 25)">
    <!-- Tower Legs -->
    <line x1="80" y1="260" x2="115" y2="60" stroke="#0B4F75" stroke-width="7" stroke-linecap="round" />
    <line x1="160" y1="260" x2="125" y2="60" stroke="#0B4F75" stroke-width="7" stroke-linecap="round" />
    <!-- Cross Bracing -->
    <line x1="90" y1="200" x2="150" y2="130" stroke="#12658F" stroke-width="3.5" />
    <line x1="150" y1="200" x2="90" y2="130" stroke="#12658F" stroke-width="3.5" />
    <!-- Apex Tower -->
    <polygon points="105,60 135,60 150,0 90,0" fill="#073B5C" />
    <!-- Extended Heavy Boom over vessel -->
    <line x1="0" y1="25" x2="260" y2="25" stroke="#0F547D" stroke-width="8" stroke-linecap="round" />
    <line x1="90" y1="0" x2="0" y2="25" stroke="#073B5C" stroke-width="3.5" />
    <line x1="150" y1="0" x2="220" y2="25" stroke="#073B5C" stroke-width="3.5" />
    <!-- Spreader with Container in mid-air -->
    <line x1="80" y1="25" x2="80" y2="105" stroke="#375264" stroke-width="2.5" />
    <rect x="62" y="105" width="36" height="10" rx="1" fill="#C26A18" />
    <rect x="64" y="115" width="32" height="18" rx="2" fill="#167A5A" />
  </g>

  <!-- Quay Apron / Concrete Berth Surface -->
  <polygon points="0,335 800,335 800,480 0,480" fill="url(#quayGrad)" />
  
  <!-- Berth Edge & Mooring Bollards -->
  <rect y="335" width="800" height="10" fill="#20303A" />
  <line x1="0" y1="335" x2="800" y2="335" stroke="#D7E0E5" stroke-width="2" stroke-dasharray="24,12" opacity="0.6" />
  
  <!-- Mooring Bollards -->
  <path d="M120,332 L124,324 L132,324 L136,332 Z" fill="#9FB5C4" />
  <path d="M380,332 L384,324 L392,324 L396,332 Z" fill="#9FB5C4" />
  <path d="M640,332 L644,324 L652,324 L656,332 Z" fill="#9FB5C4" />

  <!-- Quayside Cargo & Equipment (Containers & Steel Coils Cues) -->
  <g transform="translate(20, 345)">
    <!-- Terminal Stacking Area (Left) -->
    <rect x="10" y="10" width="70" height="35" rx="3" fill="#1B6088" />
    <rect x="85" y="10" width="70" height="35" rx="3" fill="#B87B28" />
    <rect x="45" y="-22" width="70" height="32" rx="3" fill="#2A4B5F" />
    <!-- Steel Coils row cue -->
    <circle cx="185" cy="32" r="14" fill="#607685" stroke="#3D4E59" stroke-width="3" />
    <circle cx="185" cy="32" r="5" fill="#3D4E59" />
    <circle cx="215" cy="32" r="14" fill="#607685" stroke="#3D4E59" stroke-width="3" />
    <circle cx="215" cy="32" r="5" fill="#3D4E59" />
  </g>

  <!-- Field Operator Silhouette with Tablet / Smart Terminal (Human-Centered) -->
  <g transform="translate(620, 310)">
    <!-- Safety Vest Glow / High-vis Jacket Cue -->
    <!-- Legs / Boots -->
    <path d="M68,90 L62,150 L52,150 L54,95 L40,95 L42,150 L32,150 L26,90 Z" fill="#182730" />
    <!-- Safety boots -->
    <rect x="20" y="145" width="18" height="12" rx="3" fill="#111B22" />
    <rect x="50" y="145" width="18" height="12" rx="3" fill="#111B22" />
    
    <!-- Torso / Field Uniform with High-Vis Operational Vest -->
    <path d="M24,40 L70,40 L76,92 L18,92 Z" fill="#0B4F75" />
    <!-- High-Vis Vest -->
    <path d="M28,42 L66,42 L72,88 L22,88 Z" fill="#E58A18" />
    <!-- Reflective Stripes -->
    <line x1="25" y1="65" x2="69" y2="65" stroke="#FFFFFF" stroke-width="4" opacity="0.9" />
    <line x1="24" y1="78" x2="70" y2="78" stroke="#FFFFFF" stroke-width="4" opacity="0.9" />

    <!-- Head & Hard Hat (Cảng Sài Gòn Safety Helmet) -->
    <circle cx="47" cy="24" r="12" fill="#42281D" />
    <!-- Yellow Hard Hat -->
    <path d="M32,20 C32,8 62,8 62,20 L66,22 L28,22 Z" fill="#F4B41A" />
    <rect x="27" y="21" width="40" height="3" rx="1.5" fill="#D99B0B" />

    <!-- Arms & Field Tablet / Phone -->
    <!-- Left Arm & Hand holding tablet -->
    <path d="M26,45 L10,65 L22,78 L34,58 Z" fill="#0B4F75" />
    <!-- Right Arm -->
    <path d="M68,45 L82,65 L70,78 L60,58 Z" fill="#0B4F75" />
    
    <!-- Tablet / Mobile Field Device -->
    <g transform="translate(4, 58) rotate(-15)">
      <rect x="0" y="0" width="34" height="22" rx="3" fill="#0D1B24" stroke="#4C6E84" stroke-width="1.5" />
      <!-- Glowing Screen with meter reading / operational interface UI cue -->
      <rect x="3" y="3" width="28" height="16" rx="1.5" fill="#E8F4FA" />
      <rect x="6" y="6" width="14" height="4" rx="1" fill="#0B4F75" />
      <rect x="6" y="12" width="20" height="3" rx="0.5" fill="#167A5A" />
    </g>
  </g>

  <!-- Ambient Maritime Atmospheric Overlay -->
  <rect width="800" height="480" fill="url(#sunAtmosphere)" opacity="0.3" pointer-events="none" />
</svg>
